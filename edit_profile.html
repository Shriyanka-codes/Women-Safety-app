{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .edit-profile-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .edit-profile-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #e91e63;
        }

        .edit-profile-box label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .edit-profile-box input[type="text"],
        .edit-profile-box input[type="file"],
        .edit-profile-box textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .edit-profile-box button,
        .edit-profile-box a.button-link {
            margin-top: 20px;
            padding: 10px 16px;
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .edit-profile-box a.button-link {
            background-color: #ccc;
            color: #333;
            margin-left: 10px;
        }

        .edit-profile-box button:hover {
            background-color: #c2185b;
        }

        .edit-profile-box a.button-link:hover {
            background-color: #aaa;
        }
    </style>
</head>
<body>

    <div class="edit-profile-box">
        <h2>Edit Your Profile</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Save Changes</button>
            <a href="{% url 'profile' %}" class="button-link">Cancel</a>
        </form>
    </div>

</body>
</html>
